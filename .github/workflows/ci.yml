name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package README and LICENSE match repo root
        run: |
          cmp README.md packages/chunker/README.md || { echo "::error::packages/chunker/README.md differs from README.md; copy it over"; exit 1; }
          cmp LICENSE packages/chunker/LICENSE || { echo "::error::packages/chunker/LICENSE differs from LICENSE; copy it over"; exit 1; }
          cmp LICENSE packages/crisis-signals/LICENSE || { echo "::error::packages/crisis-signals/LICENSE differs from LICENSE; copy it over"; exit 1; }
          cmp LICENSE packages/crisis-adapter-nope/LICENSE || { echo "::error::packages/crisis-adapter-nope/LICENSE differs from LICENSE; copy it over"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
