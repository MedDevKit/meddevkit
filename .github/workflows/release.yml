name: Release

# Publishes to npm via trusted publishing (OIDC): no npm token or OTP needed.
# Trigger: push a tag <prefix>-v<version> matching that package's package.json:
#   chunker-v<version>        -> @meddevkit/chunker        (packages/chunker)
#   adapter-azure-v<version>  -> @meddevkit/adapter-azure  (packages/adapter-azure)
#   crisis-signals-v<version>  -> @meddevkit/crisis-signals  (packages/crisis-signals)
#   crisis-adapter-nope-v<version>  -> @meddevkit/crisis-adapter-nope  (packages/crisis-adapter-nope)
# or run manually from main and pick the package.

on:
  push:
    tags: ['chunker-v*', 'adapter-azure-v*', 'crisis-signals-v*', 'crisis-adapter-nope-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - chunker
          - adapter-azure
          - crisis-signals
          - crisis-adapter-nope

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/chunker-v') ||
      startsWith(github.ref, 'refs/tags/adapter-azure-v') ||
      startsWith(github.ref, 'refs/tags/crisis-signals-v') ||
      startsWith(github.ref, 'refs/tags/crisis-adapter-nope-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Map the tag prefix (or the dispatch input) to a package directory and name
      - name: Select package
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PREFIX="${GITHUB_REF_NAME%-v*}"
          else
            PREFIX="$INPUT_PACKAGE"
          fi
          case "$PREFIX" in
            chunker) PKG_DIR=packages/chunker; PKG_NAME=@meddevkit/chunker ;;
            adapter-azure) PKG_DIR=packages/adapter-azure; PKG_NAME=@meddevkit/adapter-azure ;;
            crisis-signals) PKG_DIR=packages/crisis-signals; PKG_NAME=@meddevkit/crisis-signals ;;
            crisis-adapter-nope) PKG_DIR=packages/crisis-adapter-nope; PKG_NAME=@meddevkit/crisis-adapter-nope ;;
            *) echo "::error::Unknown package '$PREFIX'"; exit 1 ;;
          esac
          {
            echo "PREFIX=$PREFIX"
            echo "PKG_DIR=$PKG_DIR"
            echo "PKG_NAME=$PKG_NAME"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11, which supports trusted publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check version
        id: version
        run: |
          cd "$PKG_DIR"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$PREFIX-v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PKG_NAME version $VERSION"
            exit 1
          fi
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$VERSION is already published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, typecheck, test
        if: steps.version.outputs.skip != 'true'
        run: pnpm lint && pnpm typecheck && pnpm test

      # The "..." suffix also builds workspace dependencies first (chunker before adapter-azure,
      # crisis-signals before crisis-adapter-nope)
      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: pnpm -r --filter "$PKG_NAME..." build

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: |
          cd "$PKG_DIR"
          npm publish --provenance --access public
